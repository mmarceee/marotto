<section id="servicios" class="section" aria-labelledby="titulo-servicios">
  <div class="services container">
    <app-section-heading tag="servicios" title="Lo que hacemos" headingId="titulo-servicios" />

    <ul class="services__grid">
      @for (service of services; track service.title) {
        <li class="services__card card" appReveal>
          <svg class="services__icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="url(#icon-gradient) #a9b2ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @switch (service.icon) {
              @case ('web') {
                <rect x="3" y="4.5" width="18" height="15" rx="2" />
                <path d="M3 9.5h18M7.5 12.5l2.5 2-2.5 2M12.5 16.5h4" />
              }
              @case ('custom') {
                <rect x="3" y="3" width="7.5" height="7.5" rx="1.5" />
                <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" />
                <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" />
                <path d="M17.25 14v7M13.75 17.5h7" />
              }
              @case ('management') {
                <ellipse cx="12" cy="5.5" rx="8" ry="3" />
                <path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" />
              }
              @case ('secure') {
                <path d="M12 3l7.5 2.8v5.7c0 4.6-3.1 7.8-7.5 9.5-4.4-1.7-7.5-4.9-7.5-9.5V5.8L12 3z" />
                <path d="M8.8 12l2.3 2.3 4.2-4.4" />
              }
            }
          </svg>
          <h3 class="services__title">{{ service.title }}</h3>
          <p class="services__text">{{ service.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
